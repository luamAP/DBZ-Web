name: Python Combat Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descarregar código do repositório
      uses: actions/checkout@v4

    - name: Configurar uv e ambiente Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.11'

    - name: Executar suíte de testes unitários
      run: |
        uv run python run_tests.py ci
